[project]
name = "clef-duckdb-proxy"
version = "0.1.0"
description = "Local proxy that lets the DuckDB jev extension use Cloudflare's Clef model on the free tier."
readme = "README.md"
authors = [
    { name = "youssef", email = "" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "rich",
    "uvicorn>=0.54.0",
]

[project.scripts]
clef-duckdb-proxy = "clef_duckdb_proxy:main"